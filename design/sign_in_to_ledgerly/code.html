<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-background min-h-screen flex items-center justify-center p-4">
<!-- Main Card Container -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] overflow-hidden">
<!-- Header Section -->
<header class="pt-8 pb-6 px-8 text-center border-b border-outline-variant/30">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-container text-on-primary-container mb-4">
<span class="material-symbols-outlined text-2xl" data-icon="account_balance">account_balance</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary md:hidden block">Ledgerly</h1>
<h1 class="font-headline-lg text-headline-lg text-primary hidden md:block">Ledgerly</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Calm Finance</p>
</header>
<!-- Form Section -->
<section class="p-8" id="auth-form-container">
<!-- Toggle Tabs (Login / Sign Up) -->
<div class="flex bg-surface-container-low rounded-lg p-1 mb-8" role="tablist">
<button aria-selected="true" class="flex-1 py-2 px-4 rounded-md font-body-sm text-body-sm font-medium bg-surface-container-lowest shadow-sm text-on-surface transition-all duration-200" id="tab-login" onclick="toggleAuthMode('login')" role="tab" type="button">
                    Log In
                </button>
<button aria-selected="false" class="flex-1 py-2 px-4 rounded-md font-body-sm text-body-sm font-medium text-on-surface-variant hover:text-on-surface transition-all duration-200" id="tab-signup" onclick="toggleAuthMode('signup')" role="tab" type="button">
                    Sign Up
                </button>
</div>
<form action="#" class="space-y-5" method="POST" onsubmit="event.preventDefault();">
<!-- Display Name Field (Hidden by default for Login) -->
<div class="hidden opacity-0 transition-opacity duration-300" id="field-display-name">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1" for="display_name">Display Name</label>
<input class="w-full h-10 px-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="display_name" name="display_name" placeholder="Alex Doe" type="text"/>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1" for="email">Email Address</label>
<input class="w-full h-10 px-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-1">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#" id="link-forgot-password">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full h-10 px-3 pr-10 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-on-surface" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="icon-password-toggle">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-10 mt-6 bg-primary text-on-primary font-title-md text-title-md !text-[15px] rounded-lg hover:bg-on-primary-fixed-variant transition-colors flex justify-center items-center gap-2" id="btn-submit" type="submit">
                    Log In
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-6">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center">
<span class="px-2 bg-surface-container-lowest font-body-sm text-body-sm text-on-surface-variant">Or continue with</span>
</div>
</div>
<!-- Social Auth -->
<button class="w-full h-10 flex items-center justify-center gap-3 bg-surface-container-lowest border border-outline-variant text-on-surface font-body-sm text-body-sm rounded-lg hover:bg-surface-container-low transition-colors" type="button">
<!-- Google SVG Icon inline for fidelity -->
<svg aria-hidden="true" class="h-5 w-5" viewbox="0 0 24 24">
<path d="M12.0003 4.75C13.7703 4.75 15.3553 5.36 16.6053 6.54998L20.0303 3.125C17.9502 1.19 15.2353 0 12.0003 0C7.31028 0 3.25527 2.69 1.28027 6.60998L5.27028 9.70498C6.21525 6.86 8.87028 4.75 12.0003 4.75Z" fill="#EA4335"></path>
<path d="M23.49 12.275C23.49 11.49 23.415 10.73 23.3 10H12V14.51H18.47C18.18 15.99 17.34 17.25 16.08 18.1L19.945 21.1C22.2 19.01 23.49 15.92 23.49 12.275Z" fill="#4285F4"></path>
<path d="M5.26498 14.2949C5.02498 13.5699 4.88501 12.7999 4.88501 11.9999C4.88501 11.1999 5.01998 10.4299 5.26498 9.7049L1.275 6.60986C0.46 8.22986 0 10.0599 0 11.9999C0 13.9399 0.46 15.7699 1.28 17.3899L5.26498 14.2949Z" fill="#FBBC05"></path>
<path d="M12.0004 24C15.2404 24 17.9654 22.935 19.9454 21.095L16.0804 18.095C15.0054 18.82 13.6204 19.245 12.0004 19.245C8.8704 19.245 6.21537 17.135 5.26537 14.29L1.27539 17.385C3.25539 21.31 7.3104 24 12.0004 24Z" fill="#34A853"></path>
</svg>
                Google
            </button>
</section>
<!-- Decorative Bottom Bar -->
<div class="h-1 w-full bg-primary-container"></div>
</main>
<script>
        function toggleAuthMode(mode) {
            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');
            const displayNameField = document.getElementById('field-display-name');
            const submitBtn = document.getElementById('btn-submit');
            const forgotPasswordLink = document.getElementById('link-forgot-password');
            const displayNameInput = document.getElementById('display_name');

            // Reset classes
            loginTab.className = "flex-1 py-2 px-4 rounded-md font-body-sm text-body-sm font-medium text-on-surface-variant hover:text-on-surface transition-all duration-200";
            signupTab.className = "flex-1 py-2 px-4 rounded-md font-body-sm text-body-sm font-medium text-on-surface-variant hover:text-on-surface transition-all duration-200";

            if (mode === 'login') {
                loginTab.className = "flex-1 py-2 px-4 rounded-md font-body-sm text-body-sm font-medium bg-surface-container-lowest shadow-sm text-on-surface transition-all duration-200";
                loginTab.setAttribute('aria-selected', 'true');
                signupTab.setAttribute('aria-selected', 'false');
                
                displayNameField.classList.add('hidden');
                setTimeout(() => { displayNameField.classList.remove('opacity-100'); displayNameField.classList.add('opacity-0'); }, 10);
                displayNameInput.removeAttribute('required');
                
                forgotPasswordLink.style.display = 'block';
                submitBtn.innerHTML = `Log In <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>`;
            } else {
                signupTab.className = "flex-1 py-2 px-4 rounded-md font-body-sm text-body-sm font-medium bg-surface-container-lowest shadow-sm text-on-surface transition-all duration-200";
                signupTab.setAttribute('aria-selected', 'true');
                loginTab.setAttribute('aria-selected', 'false');
                
                displayNameField.classList.remove('hidden');
                setTimeout(() => { displayNameField.classList.remove('opacity-0'); displayNameField.classList.add('opacity-100'); }, 10);
                displayNameInput.setAttribute('required', 'true');
                
                forgotPasswordLink.style.display = 'none';
                submitBtn.innerHTML = `Create Account <span class="material-symbols-outlined text-[18px]" data-icon="person_add">person_add</span>`;
            }
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('icon-password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.setAttribute('data-icon', 'visibility_off');
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.setAttribute('data-icon', 'visibility');
                icon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
